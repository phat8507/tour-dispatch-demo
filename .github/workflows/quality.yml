name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tour_dispatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tour_dispatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          psql -h localhost -v ON_ERROR_STOP=1 -U postgres -d tour_dispatch_test -c "CREATE ROLE tour_dispatch_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci_only_runtime_password';"
        env:
          PGPASSWORD: ci_only_postgres_password
      - run: npm run db:migrate:production
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:ci_only_postgres_password@localhost:5432/tour_dispatch_test
          EXPECTED_DATABASE_NAME: tour_dispatch_test
          CONFIRM_PRODUCTION_MIGRATION: YES
      - run: npm run db:migrate:production
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:ci_only_postgres_password@localhost:5432/tour_dispatch_test
          EXPECTED_DATABASE_NAME: tour_dispatch_test
          CONFIRM_PRODUCTION_MIGRATION: YES
      - run: |
          test "$(psql -h localhost -U postgres -d tour_dispatch_test -Atc "select count(*) from dispatch_schema_migrations")" = "$(find db/migrations -name '*.sql' | wc -l)"
          test "$(psql -h localhost -U postgres -d tour_dispatch_test -Atc "select count(*) from (select filename from dispatch_schema_migrations group by filename having count(*) <> 1) duplicates")" = "0"
        env:
          PGPASSWORD: ci_only_postgres_password
      - run: npm run quality
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:ci_only_postgres_password@localhost:5432/tour_dispatch_test
          DATABASE_URL: postgresql://tour_dispatch_test:ci_only_runtime_password@localhost:5432/tour_dispatch_test
